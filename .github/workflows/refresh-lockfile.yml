name: Refresh security lockfile

on:
  pull_request:
    branches: [main]
    paths:
      - package.json

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'integration/upstream-capabilities-2026-10-08'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate lockfile only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify intended security versions
        run: |
          node -e "const p=require('./package-lock.json'); if(p.packages['node_modules/next']?.version!=='16.4.0') process.exit(1); if(p.packages['node_modules/source-map-js']?.version!=='1.2.2') process.exit(1)"
      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Refresh lockfile for security patches'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
