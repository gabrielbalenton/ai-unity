name: UNITY UI preview (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Save desktop and mobile captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-visual-check
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
