name: Verify UNITY milestone

# Quiet CI: no push-triggered builds. A draft PR can collect many commits
# without duplicate emails; the developer marks it ready once for review.
# Reopen after changes to request a fresh check, or dispatch it manually.
on:
  workflow_dispatch:
  pull_request:
    types: [ready_for_review, reopened]

concurrency:
  group: unity-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install reproducibly when lockfile exists
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Preserve generated lock candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-package-lock
          path: package-lock.json
          if-no-files-found: ignore
          retention-days: 3
      - run: npm test
      - run: npm run typecheck
      - run: npm run check:repo
      - run: npm run readiness
      - run: npm run build
      - name: Install Chromium for designated UI milestone
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[UI]')
        run: npx playwright install --with-deps chromium
      - name: Browser visual smoke tests
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[UI]')
        run: npm run test:e2e
      - name: Preserve UI screenshot and failure evidence
        if: always() && github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[UI]')
        uses: actions/upload-artifact@v4
        with:
          name: unity-ui-review
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  disposable-db-contract:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[DB]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-not-for-production
          POSTGRES_DB: unity_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d unity_contract"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      UNITY_EPHEMERAL_DATABASE: "1"
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: disposable-not-for-production
      PGDATABASE: unity_contract
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Run disposable DB schema and isolation tests
        run: bash scripts/test-db-contract.sh
