name: Verify UNITY milestone

# Quiet CI: no push-triggered builds. A draft PR can collect many commits
# without duplicate emails; the developer marks it ready once for review.
# Reopen after changes to request a fresh check, or dispatch it manually.
on:
  workflow_dispatch:
  pull_request:
    types: [ready_for_review, reopened]

concurrency:
  group: unity-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Existing lockfile task remains pending; use npm ci after pinning.
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run check:repo
      - run: npm run readiness
      - run: npm run build
      - name: Install Chromium for designated UI milestone
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[UI]')
        run: npx playwright install --with-deps chromium
      - name: Browser visual smoke tests
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[UI]')
        run: npm run test:e2e
      - name: Preserve UI screenshot and failure evidence
        if: always() && github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[UI]')
        uses: actions/upload-artifact@v4
        with:
          name: unity-ui-review
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
